[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-orchestrator"
version = "0.1.0"
description = "Local GitHub Projects orchestrator for multi-agent software delivery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Ivan Borinschi" }
]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.0,<14.0",
  "pydantic>=2.0,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
hermes = "hermes.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
